plugins {
  id 'java'
  id 'war'
  id 'groovy'
  id 'jacoco'
  id 'checkstyle'
  id 'eclipse-wtp'
  id 'idea'
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'net.researchgate.release' version '3.2.0'
}

group = groupId
version = 'SNAPSHOT'

base {
  archivesName = artifactId
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

checkstyle {
  toolVersion = '14.3.0'
  configDirectory = file('config/checkstyle')
}

dependencyCheck {
  failBuildOnCVSS = 7
  suppressionFile = 'config/dependencycheck/suppressions.xml'
  nvd {
    apiKey = System.getenv('NVD_API_KEY')
  }
}

jacoco {
  toolVersion = '0.8.15'
}

def excludedSources = ['**/model/**']

sourceSets {
  test {
    groovy {
      srcDirs = ['src/test/groovy/functional', 'src/test/groovy/unit']
    }
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${dependencyVersionSpringdoc}"

  providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'

  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.apache.groovy:groovy'
  testImplementation 'org.apache.groovy:groovy-json'
  testImplementation "org.spockframework:spock-core:${dependencyVersionSpock}"
  testImplementation "org.spockframework:spock-spring:${dependencyVersionSpock}"
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << '-parameters'
}

tasks.named('test') {
  useJUnitPlatform()
  systemProperty 'catalina.base', layout.buildDirectory.get().asFile.absolutePath
  testLogging {
    events 'passed', 'skipped', 'failed'
  }
  finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
  classDirectories.setFrom(files(classDirectories.files.collect {
    fileTree(dir: it, exclude: excludedSources)
  }))
  reports {
    xml.required = false
    csv.required = false
    html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
  }
}

tasks.named('bootRun') {
  systemProperty 'catalina.base', layout.buildDirectory.get().asFile.absolutePath
}
